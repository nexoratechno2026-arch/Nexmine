version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: nexmine_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexmine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexmine_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nexmine}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexmine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexmine_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nexmine.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
